# Local DNS resolver for the home LAN. Answers courses.home with this
# machine's LAN IP so any device on the network can reach the app by name,
# not just this machine; forwards every other query upstream like a normal
# resolver. Point your router's DHCP "DNS server" setting at this machine's
# LAN IP so devices pick this up automatically (see scraper/README.md-style
# docs in the repo root README for the exact router steps).

# Only listen on the LAN interface, not the docker/loopback interfaces —
# avoids clashing with systemd-resolved's stub listener on 127.0.0.53/54.
listen-address=192.168.11.125
bind-interfaces

# Don't read /etc/resolv.conf or /etc/hosts inside the container — the
# upstream servers below are authoritative for what this resolver forwards
# to.
no-resolv
no-hosts

# Upstream resolvers for every query that isn't courses.home. Swap these
# for your ISP's resolvers if you prefer.
server=1.1.1.1
server=8.8.8.8

# courses.home -> this machine's LAN IP. Update this if the machine's LAN
# IP ever changes (a DHCP reservation on the router avoids that).
address=/courses.home/192.168.11.125

# Don't forward plain, unqualified hostnames upstream.
domain-needed
bogus-priv
