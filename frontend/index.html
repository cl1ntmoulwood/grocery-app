<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f6f4f" />
    <meta name="description" content="Track household inventory, recipes, and local grocery prices." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Family Pantry & Price Tracker</title>
  </head>
  <body>
    <header class="app-header">
      <h1>Courses.Home</h1>
      <nav class="tabs" id="tabs">
        <button class="tab-btn is-active" data-view="inventory">Inventory</button>
        <button class="tab-btn" data-view="shopping-list">Shopping List</button>
        <button class="tab-btn" data-view="recipes">Recipes</button>
        <button class="tab-btn" data-view="prices">Prices</button>
      </nav>
    </header>
    <main id="app"></main>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
