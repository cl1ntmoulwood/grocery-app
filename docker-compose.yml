services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pantry
      POSTGRES_PASSWORD: pantry
      POSTGRES_DB: pantry
    volumes:
      - pantry_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantry -d pantry"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pantry:pantry@db:5432/pantry
      COOKIE_SECRET: c7f76b5daac7db3c1cbb08ef44d0a9f032c437d8dde5576122ff1dea665c34b6
      YOUTUBE_API_KEY: AIzaSyBK8Xvkc3gSMQVUOa2je5NbP5RWEmfTsc4
    ports:
      - "3000:3000"
    volumes:
      - ./db:/db:ro
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  dns:
    build:
      context: .
      dockerfile: Dockerfile.dnsmasq
    restart: unless-stopped
    # Host networking so dnsmasq can bind directly to the LAN interface
    # (listen-address in dnsmasq.conf) — a bridge network's NAT can't serve
    # DNS to other devices on the LAN the way this needs to.
    network_mode: host

volumes:
  pantry_db_data:
  uploads_data:
